<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mengalihkan Reset Password...</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
    }
    .card {
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 16px;
      padding: 2.5rem 2rem;
      text-align: center;
      max-width: 400px;
      width: 90%;
    }
    .icon { font-size: 2.5rem; margin-bottom: 1rem; }
    h1 { font-size: 1.3rem; font-weight: 600; margin-bottom: 0.5rem; }
    p  { font-size: 0.9rem; color: #a0aec0; margin-bottom: 1.5rem; }
    .spinner {
      width: 36px; height: 36px;
      border: 3px solid rgba(255,255,255,0.15);
      border-top-color: #667eea;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error { color: #ff6b6b; font-size: 0.9rem; margin-top: 1rem; }
    a { color: #4a9eff; text-decoration: underline; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🛡️</div>
    <h1>Detektor Phishing URL</h1>
    <p id="status">Memverifikasi link reset password...</p>
    <div class="spinner" id="spinner"></div>
    <p class="error" id="error" style="display:none"></p>
  </div>

  <script>
    // URL Streamlit app — ganti dengan URL app kamu
    const STREAMLIT_URL = "https://phishing-detector-uas-ki.streamlit.app";

    (function () {
      const hash = window.location.hash.substring(1);
      const params = new URLSearchParams(hash);

      const accessToken  = params.get("access_token");
      const refreshToken = params.get("refresh_token") || "";
      const type         = params.get("type");

      if (type === "recovery" && accessToken) {
        // Redirect ke Streamlit dengan token sebagai query params
        const target = STREAMLIT_URL
          + "?access_token=" + encodeURIComponent(accessToken)
          + "&refresh_token=" + encodeURIComponent(refreshToken)
          + "&type=recovery";

        document.getElementById("status").textContent = "Mengalihkan ke halaman reset password...";

        setTimeout(function () {
          window.location.replace(target);
        }, 1000);

      } else {
        // Token tidak valid atau link bukan untuk recovery
        document.getElementById("spinner").style.display = "none";
        document.getElementById("status").textContent = "Link tidak valid atau sudah kadaluarsa.";
        document.getElementById("error").style.display = "block";
        document.getElementById("error").innerHTML =
          'Silakan <a href="' + STREAMLIT_URL + '">kembali ke aplikasi</a> dan minta link baru.';
      }
    })();
  </script>
</body>
</html>
